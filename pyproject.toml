[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gwm-workflow"
version = "0.1.0"
description = "Guided-wave metasurface reproduction workflows (L01 Huang 2023 / L02 Guo 2020)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "jpype1>=1.4",
  "mph>=1.2",
  "pytest>=7",
  "matplotlib>=3.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
